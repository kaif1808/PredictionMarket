name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck frontend contract path
        working-directory: client
        run: npm run typecheck

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Migration smoke
        run: |
          DATABASE_URL=sqlite:///./ci_migration.db alembic upgrade head

      - name: Deployment readiness (strict env)
        env:
          DATABASE_URL: postgres://ci.example/valdoria
          SESSION_SECRET: ci-secret-not-default
          ADMIN_USER: admin
          ADMIN_PASS: admin-pass
          ALLOWED_ORIGINS: https://ci.example
          COOKIE_SECURE: "true"
          TOURNAMENT_TIE_BREAK_MODE: shared_prize
        run: python3 scripts/deployment_readiness_check.py --strict-env

      - name: Prelaunch evidence dry run
        run: |
          python3 scripts/prelaunch_evidence.py \
            --spawn-local \
            --sessions 1 \
            --subject-count 8 \
            --trades-per-participant 1 \
            --require-state-sync-ratio 1.0 \
            --require-price-update-ratio 1.0 \
            --max-trade-p99-ms 5000 \
            --max-state-sync-p99-ms 5000 \
            --reconnect-latency-budget-ms 5000 \
            --output results/prelaunch_evidence.ci.json
